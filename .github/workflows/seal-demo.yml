name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Pin to full commit SHA to prevent supply-chain attacks via mutable tags
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0acd6853f8c4e2c04cd98e7f11c8a31abb66b4fe # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check ceyo/ ceyo_verify/ tests/
      - run: mypy ceyo/ ceyo_verify/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0acd6853f8c4e2c04cd98e7f11c8a31abb66b4fe # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=80

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0acd6853f8c4e2c04cd98e7f11c8a31abb66b4fe # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Generate an ephemeral key pair for this CI run only.
      # The private key is NEVER uploaded or retained as a build artifact.
      - run: ceyo keygen --out-private /tmp/ci_private.pem --out-public /tmp/ci_public.pem
      # Seal the sample record
      - run: ceyo seal example_artifact/sample_record.json --key /tmp/ci_private.pem -o example_artifact/sealed_artifact.json
      # Verify with the SDK CLI
      - run: ceyo verify example_artifact/sealed_artifact.json /tmp/ci_public.pem
      # Verify with the standalone verifier
      - run: python -m ceyo_verify example_artifact/sealed_artifact.json /tmp/ci_public.pem
      # Upload only the sealed artifact (public output); private key is not uploaded
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sealed-output
          retention-days: 7
          path: |
            example_artifact/sealed_artifact.json
