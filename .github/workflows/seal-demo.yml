name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check ceyo/ ceyo_verify/ tests/
      - run: mypy ceyo/ ceyo_verify/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --fail-under=80

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Generate a fresh key pair
      - run: ceyo keygen --out-private example_artifact/private_key.pem --out-public example_artifact/public_key.pem
      # Seal the sample record
      - run: ceyo seal example_artifact/sample_record.json --key example_artifact/private_key.pem -o example_artifact/sealed_artifact.json
      # Verify with the SDK CLI
      - run: ceyo verify example_artifact/sealed_artifact.json example_artifact/public_key.pem
      # Verify with the standalone verifier
      - run: python -m ceyo_verify example_artifact/sealed_artifact.json example_artifact/public_key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-output
          path: |
            example_artifact/sealed_artifact.json
            example_artifact/public_key.pem
