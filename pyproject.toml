[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceyo"
version = "0.1.0"
description = "Evidentiary infrastructure prototype for AI systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "rfc8785",
]

[project.optional-dependencies]
kms = [
    "boto3",
]
dev = [
    "ruff",
    "mypy",
    "coverage",
]

[project.scripts]
ceyo = "ceyo.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
