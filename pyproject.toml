[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceyo"
version = "0.1.0"
description = "Reference implementation of the CEYO evidentiary protocol for AI systems"
readme = "README.md"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Brian Covarrubias", email = "contact@ceyo.ai" },
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41,<44",
    "rfc8785>=0.1,<2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "coverage",
]

[project.urls]
Homepage = "https://ceyo.ai"
Repository = "https://github.com/NDR-US/ceyo-protocol"

[project.scripts]
ceyo = "ceyo.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
